[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reportkit"
version = "0.1.0"
description = "A Python library for building report documents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Jinja2==3.1.6",
]

[project.optional-dependencies]
pdf = [
    "weasyprint>=70",
]

[tool.setuptools.packages.find]
where = ["src"]
